# ParcelTrack CI pipeline.
#
# Backend jobs (lint / test / typecheck) trigger only on changes under
# parcel-track/**; mobile job (mobile-typecheck) triggers only on changes
# under parcel-track-mobile/**. A change touching only one side runs only
# that side's jobs.
#
# Backend (parcel-track/) — three parallel jobs:
#   1. lint        — ruff check + ruff format --check
#   2. test        — pytest against a real Postgres service container
#   3. typecheck   — mypy
#
# Mobile (parcel-track-mobile/) — three jobs:
#   4. mobile-typecheck — npm ci + tsc --noEmit.
#   5. mobile-test      — npm ci + jest (pure-logic, ts-jest, node env).
#   6. mobile-lint      — npm ci + eslint + prettier --check. REPORT-ONLY
#                         (continue-on-error) until a cleanup pass; see job.
#
# The backend tests run against Postgres (not SQLite) to match production
# behaviour. A TEST_DATABASE_URL env var is set so conftest.py can pick it up.

name: CI

on:
  push:
    branches: [main]
    paths:
      - "parcel-track/**"
      - "parcel-track-mobile/**"
      - ".github/workflows/ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "parcel-track/**"
      - "parcel-track-mobile/**"
      - ".github/workflows/ci.yml"

# NOTE: no top-level `defaults.run.working-directory` — each job sets its
# own. Backend jobs run from `parcel-track/`, mobile jobs from
# `parcel-track-mobile/`. A single shared default would break one or the
# other.

jobs:
  # ── Lint ──────────────────────────────────────────────────────────────────
  lint:
    name: Ruff lint + format
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parcel-track
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check app/ tests/

      - name: Ruff format check
        run: uv run ruff format --check app/ tests/

  # ── Tests ─────────────────────────────────────────────────────────────────
  test:
    name: Pytest (Postgres)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parcel-track

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: parceltrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U ci -d parceltrack_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      # App settings for the test run.
      APP_ENV: testing
      SECRET_KEY: ci_only_test_secret_key_not_for_production_xxxxxxxxx
      DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/parceltrack_test
      DATABASE_URL_SYNC: postgresql://ci:ci@localhost:5432/parceltrack_test
      TEST_DATABASE_URL: postgresql+asyncpg://ci:ci@localhost:5432/parceltrack_test
      LOG_LEVEL: WARNING
      # Storage placeholders — mocked in tests.
      STORAGE_BUCKET: ci-bucket
      STORAGE_ENDPOINT_URL: https://fake.r2.cloudflarestorage.com
      STORAGE_ACCESS_KEY_ID: fake
      STORAGE_SECRET_ACCESS_KEY: fake
      STORAGE_PUBLIC_URL: https://fake.cdn.example.com
      REDIS_URL: redis://localhost:6379/0

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Run migrations
        run: uv run alembic upgrade head

      - name: Run tests
        run: uv run pytest tests/ -q --tb=short

  # ── Type checking ─────────────────────────────────────────────────────────
  typecheck:
    name: Mypy
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parcel-track

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          version: "0.9.x"

      - name: Set up Python
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --frozen --group dev

      - name: Mypy
        run: uv run mypy app/

  # ── Mobile typecheck ──────────────────────────────────────────────────────
  mobile-typecheck:
    name: TS typecheck (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parcel-track-mobile

    steps:
      - uses: actions/checkout@v4

      # `npm ci` is reproducible (uses package-lock.json exactly) and faster
      # than `npm install` in CI. Requires the lockfile to be committed.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: parcel-track-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Catches missing imports, type errors, broken refactors.
      # Does NOT catch runtime-only issues (e.g. RN missing browser globals
      # like DOMException — TS's default DOM lib lies about availability).
      - name: TypeScript check
        run: npx tsc --noEmit

  # ── Mobile tests ──────────────────────────────────────────────────────────
  mobile-test:
    name: Jest (mobile)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: parcel-track-mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: parcel-track-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Pure-logic tests only (ts-jest, node env). RN component tests are
      # not in scope here — see jest.config.js in the mobile project.
      - name: Run tests
        run: npm test -- --ci

  # ── Mobile lint (REPORT-ONLY) ─────────────────────────────────────────────
  # eslint-config-expo + prettier. NON-BLOCKING for now: the existing tree
  # predates linting and reports pre-existing nits (and a sibling code PR may
  # have in-flight changes), so a hard failure here would be noise. The job
  # surfaces problems in the logs without failing CI. Once a dedicated cleanup
  # pass makes the tree pass, drop `continue-on-error` to flip it to blocking.
  # (Mirrors how the backend's mypy job started non-blocking.)
  mobile-lint:
    name: ESLint + Prettier (mobile, report-only)
    runs-on: ubuntu-latest
    continue-on-error: true
    defaults:
      run:
        working-directory: parcel-track-mobile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: parcel-track-mobile/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: ESLint
        run: npm run lint

      - name: Prettier check
        run: npm run format:check
