[project]
name = "parcel-track"
version = "0.1.0"
description = "Parcel tracking backend API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Database
    "sqlalchemy==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "python-multipart==0.0.9",
    # Validation / settings
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.1.1",
    # File uploads
    "boto3==1.34.96",
    # Background jobs
    "celery==5.4.0",
    "redis==5.0.4",
    # Notifications
    "httpx==0.27.0",
    # Utilities
    "python-dotenv==1.0.1",
    "pytz==2024.1",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "aiosqlite>=0.20",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
