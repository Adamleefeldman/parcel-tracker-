[project]
name = "parcel-track"
version = "0.1.0"
description = "Parcel tracking backend API"
requires-python = ">=3.12"
dependencies = [
    # Web framework
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    # Database
    "sqlalchemy[asyncio]==2.0.30",
    "alembic==1.13.1",
    "asyncpg==0.29.0",
    "psycopg2-binary==2.9.9",
    # Auth
    "python-jose[cryptography]==3.3.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt>=3.1,<4.0",
    "python-multipart==0.0.9",
    # Validation / settings
    "pydantic==2.7.1",
    "pydantic-settings==2.2.1",
    "email-validator==2.1.1",
    # File uploads
    "boto3==1.34.96",
    # Background jobs
    "celery==5.4.0",
    "redis==5.0.4",
    # Notifications
    "httpx==0.27.0",
    # Utilities
    "python-dotenv==1.0.1",
    "pytz==2024.1",
    "slowapi>=0.1.9",
    # Logging
    "python-json-logger>=2.0.7",
    "sentry-sdk[fastapi]>=2.58.0",
    "prometheus-fastapi-instrumentator>=7.1.0",
]

[dependency-groups]
dev = [
    "pytest==8.2.0",
    "pytest-asyncio==0.23.6",
    "aiosqlite>=0.20",
    "ruff>=0.15.10",
    "mypy>=1.20.0",
    "fakeredis>=2.23.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"

# ── Ruff ──────────────────────────────────────────────────────────────────────

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["app", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "UP",  # pyupgrade
    "S",   # flake8-bandit (security)
    "RUF", # ruff-specific rules
]
ignore = [
    "S101",  # assert is fine in tests
    "S105",  # possible hardcoded password — too noisy for config modules
    "S106",  # same (function arg defaults)
    "B008",  # do not perform function call in argument defaults — conflicts with Depends()
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S"]  # don't flag security issues in test helpers

[tool.ruff.lint.isort]
known-first-party = ["app"]

# ── Mypy ──────────────────────────────────────────────────────────────────────

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
# Non-strict baseline. Future work: layer per-module strict overrides for
# core / db / schemas once their helper-function annotations are filled in
# (currently surfaces ~150 no-untyped-def / no-untyped-call errors from
# the factory funcs in models.py and pydantic validators in schemas.py).
ignore_missing_imports = true
check_untyped_defs = true
